[project]
name = "prosdd"
version = "0.1.0"
description = "Learning prosodic representations for speech deepfake detection"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "librosa==0.11.0",
    "masked-prosody-model==0.3.0",
    "numpy==1.26.4",
    "scipy",
    "soundfile==0.13.1",
    "tqdm",
    "transformers==4.51.3",
    "wandb>=0.19,<0.20",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "triton==3.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
